  :root { --red:#A8272E; --ink:#1d2327; --muted:#5b6670; --bg:#f6f7f5; --panel:#ffffff; --line:#d9ddd8; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color:var(--ink); background:var(--bg); }
  header { padding:14px 16px 10px; }
  h1 { margin:0; font-size:20px; }
  .sub { margin:2px 0 0; color:var(--muted); font-size:13px; }
  .sample { display:inline-block; margin-left:6px; padding:0 8px; border:1px solid var(--line); border-radius:999px; color:#9a5b00; }
  #map { height:calc(100vh - 120px); min-height:420px; }
  .legend { background:var(--panel); padding:8px 10px; border-radius:6px; box-shadow:0 1px 4px rgba(0,0,0,.25); font-size:13px; line-height:1.6; }
  .legend b { display:block; margin-bottom:2px; }
  .sw { display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:-1px; }
  .pop b { font-size:14px; }
  .pop div { font-size:13px; }
  select { font:inherit; font-size:13px; margin-left:6px; }
  a { color:var(--red); }
  .site-foot { padding:8px 16px 10px; text-align:center; font-size:13px; color:var(--muted); line-height:1.7; }
  .site-foot a { color:var(--red); }
</style>

const CAUSE_COLOURS = {
  'Lost / navigation': '#A8272E',
  'Slip or fall injury': '#1f6fb2',
  'Cragfast': '#e08a00',
  'Medical': '#2e8b57',
  'Exhaustion / benighted': '#7a4fb5',
  'Overdue search': '#0e8a8a',
  'Other': '#6b6b6b'
};
// Colours for the real D4H root causes. Any other cause gets the next spare colour.
Object.assign(CAUSE_COLOURS, {
  'Lost': '#A8272E', 'Injured': '#1f6fb2', 'Crag Fast': '#e08a00', 'Medical Emergency': '#2e8b57',
  'Benighted': '#7a4fb5', 'Overdue': '#0e8a8a', 'Missing': '#c2185b', 'Split from party': '#8d6e00',
  'Not recorded': '#9aa0a6'
});
const SPARE = ['#5d4037', '#00838f', '#6a1b9a', '#827717', '#bf360c', '#283593', '#558b2f', '#4e342e', '#37474f'];
const colourFor = (c) => {
  if (!CAUSE_COLOURS[c]) CAUSE_COLOURS[c] = SPARE[Object.keys(CAUSE_COLOURS).length % SPARE.length];
  return CAUSE_COLOURS[c];
};

const map = L.map('map');
let layers = [], control = null, scale = null;
L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png', {
  maxZoom: 17,
  attribution: 'Map data &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, <a href="https://opentopomap.org">OpenTopoMap</a> (CC-BY-SA)'
}).addTo(map);
map.setView([54.465, -3.235], 13);

function esc(s) { return String(s ?? '').replace(/[&<>"]/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

function draw(points) {
  layers.forEach((l) => map.removeLayer(l)); layers = [];
  if (control) map.removeControl(control);
  const groups = {};
  points.forEach((p) => {
    const lat = Number(p.lat), lon = Number(p.lon);
    if (!isFinite(lat) || !isFinite(lon)) return;
    const cause = p.cause || 'Other';
    if (!groups[cause]) { groups[cause] = L.layerGroup().addTo(map); layers.push(groups[cause]); }
    L.circleMarker([lat, lon], { radius: 6, color: colourFor(cause), weight: 2, fillOpacity: .55 })
      .bindPopup(
        '<div class="pop"><b>' + esc(p.ref) + '</b> &middot; ' + esc(p.month) + (p.year ? ' ' + esc(p.year) : '') +
        '<div>Where: ' + esc(p.location) + '</div>' +
        (p.type ? '<div>Type: ' + esc(p.type) + '</div>' : '') +
        '<div>Cause: ' + esc((p.causes && p.causes.length ? p.causes.join(', ') : cause)) + '</div>' +
        (p.grid_ref ? '<div>Grid ref: ' + esc(p.grid_ref) + '</div>' : '') +
        '<div>' + lat.toFixed(5) + ', ' + lon.toFixed(5) + '</div></div>')
      .addTo(groups[cause]);
  });

  // Tick boxes to show or hide each root cause
  const overlays = {};
  Object.keys(groups).sort().forEach((c) => {
    const n = groups[c].getLayers().length;
    overlays['<span class="sw" style="background:' + colourFor(c) + '"></span>' + esc(c) + ' (' + n + ')'] = groups[c];
  });
  control = L.control.layers(null, overlays, { collapsed: window.innerWidth < 600 }).addTo(map);

  const pts = points.filter((p) => isFinite(Number(p.lat))).map((p) => [Number(p.lat), Number(p.lon)]);
  if (pts.length) map.fitBounds(pts, { padding: [28, 28] });
  if (!scale) scale = L.control.scale({ imperial: false }).addTo(map);
}

// Year picker, shown when the data has more than one year.
function withYears(rows) {
  const years = [...new Set(rows.map((r) => r.year).filter(Boolean))].sort((a, b) => b - a);
  if (years.length < 2) { draw(rows); return; }
  const pick = document.getElementById('year');
  pick.innerHTML = years.map((y) => '<option>' + y + '</option>').join('') + '<option value="all">All years</option>';
  pick.hidden = false;
  const show = () => {
    const v = pick.value;
    document.getElementById('which').textContent = v === 'all' ? 'All call-outs' : 'Call-outs in ' + v;
    draw(v === 'all' ? rows : rows.filter((r) => String(r.year) === v));
  };
  pick.onchange = show; show();
}

fetch('callouts.json', { cache: 'no-store' })
  .then((r) => { if (!r.ok) throw new Error(); return r.json(); })
  .then((rows) => { document.getElementById('sampleBadge').hidden = true; withYears(rows); })
  .catch(() => draw(SAMPLE));
